
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SCoPE2"
version = "0.0.1"
authors = [
  { name="José Gonçalves", email="jpsgs@isep.ipp.pt" },
]
description = "A simple framework to apply transformations to source code."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "tree-sitter==0.23.0",
    "ruamel.yaml>=0.2.7"
]
[project.urls]
Homepage = "https://github.com/jp2425/SCoPE2"
Issues = "https://github.com/jp2425/SCoPE2/issues"


